<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer pulse ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#waveGrad)" stroke-width="4" opacity="0.3" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#waveGrad)" stroke-width="6" opacity="0.6"/>
  
  <!-- Vinyl grooves -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Central Glow Play Triangles / Sound Waves -->
  <path d="M225 185 L325 256 L225 327 Z" fill="url(#waveGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="18" fill="#ffffff" opacity="0.9"/>
  <circle cx="256" cy="256" r="6" fill="#0f172a"/>
</svg>
